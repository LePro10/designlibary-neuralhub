# One Cloudflare Worker serves the whole site: static showcase from dist/,
# and the MCP endpoint at /mcp (mcp/server.mjs). Deployed by .github/workflows/pages.yml.
name = "neuralhub-ui"
main = "mcp/server.mjs"
compatibility_date = "2025-01-01"
routes = [{ pattern = "ui.neuralhub.dev", custom_domain = true }]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/mcp"]
