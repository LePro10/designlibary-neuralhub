# Builds the showcase and deploys it to Cloudflare (static site + /mcp endpoint).
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: Showcase

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm registry:check
      - run: pnpm build
      # Screenshots + library.json feed the MCP server (docs/mcp.md). Screenshots
      # are best-effort: the showcase still deploys if the browser step fails.
      - run: pnpm exec playwright-core install --with-deps chromium
        continue-on-error: true
      - run: pnpm shots
        continue-on-error: true
      - run: pnpm bundle
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    # Only the default branch publishes; other branches just prove the build.
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
