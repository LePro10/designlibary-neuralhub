# Deploys the remote MCP endpoint to Cloudflare Workers when mcp/ changes.
# Needs repo secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID; without them
# the step is skipped (stdio usage via mcp.mjs keeps working, see docs/mcp.md).
name: MCP endpoint

on:
  push:
    branches: [main]
    paths: ['mcp/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: mcp
        run: npx --yes wrangler@4 deploy
